[package]
name = "pseudo-gateway"
version = "0.2.7"
edition = "2021"
description = "Passerelle de pseudonymisation chiffrée (AES-256-GCM) entre Spring AI RAG et un LLM cloud"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
regex = "1"
once_cell = "1"
hex = "0.4"
rand = "0.8"
# Client HTTP pour appeler le service NER Presidio. default-features = false
# évite la dépendance TLS/OpenSSL (on ne tape que du http://localhost).
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# Déduplication sans clair : blind index = HMAC-SHA256 de la valeur.
hmac = "0.12"
sha2 = "0.10"
# Trait de persistance async (VaultStore) implémentable par InMemory/Redis/Postgres.
async-trait = "0.1"
# Gestion d'erreurs propre (plus de .unwrap() dans les handlers) + logs structurés.
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Coffre persistant et partagé. ConnectionManager = pool multiplexé auto-reconnectant.
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
# API publique : CORS, limite de corps, timeout de requête.
tower-http = { version = "0.5", features = ["cors", "limit", "timeout"] }
# Comparaison de clés d'API en temps constant (pas de fuite par chronométrage).
subtle = "2"
# Spécification OpenAPI générée depuis le code (servie sur /openapi.json).
utoipa = "5"
# Lecture d'un fichier .env à côté du binaire (installation hors Docker).
dotenvy = "0.15"

[dev-dependencies]
# Tests du routeur sans ouvrir de port (ServiceExt::oneshot).
tower = { version = "0.4", features = ["util"] }

# Binaires distribués : petits et rapides.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
