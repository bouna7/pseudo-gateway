# Stack de la passerelle : Redis (persistant) + Presidio (NER) + gateway.
#
# ⚠️ Compose Dokploy : AUCUN port n'est publié sur l'hôte. Le proxy Dokploy
# (Traefik) route le domaine vers le port INTERNE 8080 du conteneur `gateway`
# (configuré dans l'onglet « Domains » du service Compose). Publier un port hôte
# ici provoque « address already in use » sur le serveur Dokploy.
#
# Pour un test LOCAL avec ports publiés sur ta machine :
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - pseudo-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # NER (noms, lieux, organisations) — Microsoft Presidio, en local sur le VPS
  # (aucune donnée ne sort : conforme au positionnement EU/RGPD).
  #
  # SANS ce conteneur, la passerelle fonctionne en repli regex seul
  # (EMAIL/PHONE/IBAN/CARD) et logue « NER (Presidio) indisponible » à chaque
  # appel : les NOMS et VILLES partent en clair au LLM — c'était le cas en
  # prod depuis le début (constaté le 2026-07-18 via l'aperçu confidentialité).
  #
  # La détection reste best-effort (src/ner.rs) : le gateway démarre et répond
  # même si Presidio est down ou encore en train de charger ses modèles
  # (~30-60 s au premier démarrage). RAM ≈ 2 Go (modèles FR + EN en mémoire).
  #
  # Image custom (./presidio) : image officielle + modèle spaCy FRANÇAIS
  # (fr_core_news_lg) — l'officielle seule n'a que l'anglais et rate une
  # partie des noms/villes sur les documents français.
  presidio:
    build: ./presidio
    restart: unless-stopped
    environment:
      # Délai de boot/req du worker gunicorn. L'env GUNICORN_CMD_ARGS prime
      # sur le fichier de conf de l'image. Sans marge, le chargement du modèle
      # spaCy au boot peut dépasser le délai par défaut → worker tué/relancé
      # en boucle : le master écoute (port ouvert) mais aucune requête n'est
      # jamais servie — vu en prod le 2026-07-18 (timeouts gateway 45 min).
      GUNICORN_CMD_ARGS: "--timeout 300"
    # Pas de port hôte (règle Dokploy, cf. en-tête) : joignable uniquement via
    # le réseau interne du compose, sur son port 3000.

  gateway:
    build: .
    environment:
      VAULT_STORE: redis
      REDIS_URL: redis://redis:6379
      # NER : le conteneur presidio ci-dessus (port interne 3000).
      PRESIDIO_URL: http://presidio:3000
      PRESIDIO_LANG: fr  # modèle français fr_core_news_lg (cf. ./presidio)
      # Secrets : à définir dans l'onglet « Environment » de Dokploy (jamais committés).
      # Mode versionné (recommandé) :
      PSEUDO_KEY_1: ${PSEUDO_KEY_1:-}
      PSEUDO_CURRENT_KEY_ID: ${PSEUDO_CURRENT_KEY_ID:-}
      PSEUDO_INDEX_KEY: ${PSEUDO_INDEX_KEY:-}
      # Repli clé unique (si tu n'utilises pas PSEUDO_KEY_*) :
      MASTER_KEY: ${MASTER_KEY:-}
      # Protection des endpoints sensibles (partagé avec files_service) :
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      # API publique (comptes + clés par utilisateur) : activée si ADMIN_API_KEY est définie.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      PUBLIC_SIGNUP: ${PUBLIC_SIGNUP:-false}
      DEFAULT_RATE_PER_MIN: ${DEFAULT_RATE_PER_MIN:-60}
      DEFAULT_MONTHLY_QUOTA: ${DEFAULT_MONTHLY_QUOTA:-10000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Derrière Traefik (Dokploy) : l'IP client vient de X-Forwarded-For.
      TRUST_PROXY: "true"
      RUST_LOG: info
    expose:
      - "8080"
    depends_on:
      redis:
        condition: service_healthy
      # service_started (PAS service_healthy) : le NER est best-effort, le
      # gateway ne doit JAMAIS être bloqué au démarrage par Presidio.
      presidio:
        condition: service_started
    restart: unless-stopped

volumes:
  pseudo-redis-data:
