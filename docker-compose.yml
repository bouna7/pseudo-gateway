# Stack de la passerelle : Redis (persistant) + Presidio (NER) + gateway.
#
# ⚠️ Compose Dokploy : AUCUN port n'est publié sur l'hôte. Le proxy Dokploy
# (Traefik) route le domaine vers le port INTERNE 8080 du conteneur `gateway`
# (configuré dans l'onglet « Domains » du service Compose). Publier un port hôte
# ici provoque « address already in use » sur le serveur Dokploy.
#
# Pour un test LOCAL avec ports publiés sur ta machine :
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - pseudo-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # NER (noms, lieux, organisations) — Microsoft Presidio, en local sur le VPS
  # (aucune donnée ne sort : conforme au positionnement EU/RGPD).
  #
  # SANS ce conteneur, la passerelle fonctionne en repli regex seul
  # (EMAIL/PHONE/IBAN/CARD) et logue « NER (Presidio) indisponible » à chaque
  # appel : les NOMS et VILLES partent en clair au LLM — c'était le cas en
  # prod depuis le début (constaté le 2026-07-18 via l'aperçu confidentialité).
  #


   # La détection reste best-effort (src/ner.rs) : le gateway démarre et répond
  # même si Presidio est down ou encore en train de charger ses modèles
  # (~30-60 s au premier démarrage). RAM ≈ 2 Go (modèles FR + EN en mémoire).
  #
  # Image custom (./presidio) : image officielle + modèle spaCy FRANÇAIS
  # (fr_core_news_lg) — l'officielle seule n'a que l'anglais et rate une
  # partie des noms/villes sur les documents français.
  #
  # ⚠️ SERVICE DÉSACTIVÉ PAR DÉFAUT (profil `ner-compose`) — lire ceci avant
  # de le réactiver. Constaté le 2026-11-11 sur le VPS de production : un
  # conteneur presidio **créé par compose** n'amorce jamais son worker
  # gunicorn. Le journal s'arrête après `Control socket listening`, sans
  # `Booting worker`, sans erreur : le master écoute, rien n'est jamais servi,
  # et la passerelle retombe en silence sur ses quatre regex — les noms, les
  # villes et les organisations partent alors EN CLAIR au modèle. 2 h 45 de
  # fuite ce jour-là, et 45 min le 2026-07-18.
  #
  # Le même conteneur, la même image et la même variable lancés par
  # `docker run` servent correctement : vérifié six fois, en faisant varier
  # l'image, le niveau de journal, le réseau de la pile, l'attachement des
  # flux et la politique de redémarrage. La cause reste inconnue ; ni un
  # `docker restart` ni un `compose up --force-recreate` ne guérissent le
  # conteneur fautif, donc aucun gardien automatique n'y changerait rien.
  #
  # D'où ce choix : en production, Presidio vit HORS compose, posé et vérifié
  # par `presidio/presidio-autonome.sh` (il refuse de basculer si le candidat
  # ne détecte rien). Le service ci-dessous reste pour le développement local
  # et les hébergeurs où compose se comporte normalement :
  #     docker compose --profile ner-compose up
  presidio:
    profiles: ["ner-compose"]
    build: ./presidio
    restart: unless-stopped
    environment:
      # Délai de boot/req du worker gunicorn. L'env GUNICORN_CMD_ARGS prime
      # sur le fichier de conf de l'image. Sans marge, le chargement du modèle
      # spaCy au boot peut dépasser le délai par défaut → worker tué/relancé
      # en boucle : le master écoute (port ouvert) mais aucune requête n'est
      # jamais servie — vu en prod le 2026-07-18 (timeouts gateway 45 min).
      GUNICORN_CMD_ARGS: "--timeout 300"
    # Pas de port hôte (règle Dokploy, cf. en-tête) : joignable uniquement via
    # le réseau interne du compose, sur son port 3000.
    #
    # Sonde qui exige une DÉTECTION, pas un port ouvert. L'image en embarque
    # une qui interroge /health : le 2026-11-11 elle a signalé « unhealthy »
    # pendant 2 h 45 (302 échecs d'affilée) sans que rien ne s'en émeuve,
    # pendant que les noms et les villes partaient en clair au modèle. Celle-ci
    # vérifie que le modèle répond ET qu'il reconnaît une personne.
    #
    # start_period long : charger fr_core_news_lg prend 20 à 60 s, et l'échec
    # d'une sonde pendant ce temps-là est normal, pas une panne.
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf -m 10 -X POST localhost:3000/analyze -H "Content-Type: application/json" -d "{\"text\":\"Jean Martin habite a Lyon\",\"language\":\"fr\"}" | grep -q PERSON']
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 120s

  gateway:
    build: .
    environment:
      VAULT_STORE: redis
      REDIS_URL: redis://redis:6379
      # NER : le conteneur presidio ci-dessus (port interne 3000).
      PRESIDIO_URL: http://presidio:3000
      PRESIDIO_LANG: fr  # modèle français fr_core_news_lg (cf. ./presidio)
      # Secrets : à définir dans l'onglet « Environment » de Dokploy (jamais committés).
      # Mode versionné (recommandé) :
      PSEUDO_KEY_1: ${PSEUDO_KEY_1:-}
      PSEUDO_CURRENT_KEY_ID: ${PSEUDO_CURRENT_KEY_ID:-}
      PSEUDO_INDEX_KEY: ${PSEUDO_INDEX_KEY:-}
      # Repli clé unique (si tu n'utilises pas PSEUDO_KEY_*) :
      MASTER_KEY: ${MASTER_KEY:-}
      # Protection des endpoints sensibles (partagé avec files_service) :
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      # API publique (comptes + clés par utilisateur) : activée si ADMIN_API_KEY est définie.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      # Sans ADMIN_API_KEY, une cle est creee au premier demarrage et affichee
      # dans les journaux : la console est utilisable sans rien configurer.
      ADMIN_BOOTSTRAP: ${ADMIN_BOOTSTRAP:-true}
      PUBLIC_SIGNUP: ${PUBLIC_SIGNUP:-false}
      SIGNUP_PER_IP_PER_HOUR: ${SIGNUP_PER_IP_PER_HOUR:-5}
      # Code exige a l'inscription publique : sans lui, n'importe qui cree un compte.
      SIGNUP_INVITE_CODE: ${SIGNUP_INVITE_CODE:-}
      # Exiger une invitation a l'inscription (defaut oui).
      SIGNUP_REQUIRE_INVITE: ${SIGNUP_REQUIRE_INVITE:-true}
      DEFAULT_PLAN: ${DEFAULT_PLAN:-free}
      DEFAULT_RATE_PER_MIN: ${DEFAULT_RATE_PER_MIN:-60}
      DEFAULT_MONTHLY_QUOTA: ${DEFAULT_MONTHLY_QUOTA:-10000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      # Console d'administration sur /admin/ui (création de comptes au navigateur).
      ENABLE_ADMIN_UI: ${ENABLE_ADMIN_UI:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1048576}
      REQUEST_TIMEOUT_SECS: ${REQUEST_TIMEOUT_SECS:-30}
      # Proxy de filtrage : hotes joignables (none = proxy eteint).
      PROXY_ALLOWED_HOSTS: ${PROXY_ALLOWED_HOSTS:-}
      PROXY_TIMEOUT_SECS: ${PROXY_TIMEOUT_SECS:-120}
      PRESIDIO_TIMEOUT_MS: ${PRESIDIO_TIMEOUT_MS:-4000}
      # Toute option ajoutée au service doit être reprise ici : ce qui n'est pas
      # dans cette liste n'atteint jamais le conteneur, même défini côté Dokploy.
      # Derrière Traefik (Dokploy) : l'IP client vient de X-Forwarded-For.
      TRUST_PROXY: "true"
      RUST_LOG: info
    expose:
      - "8080"
    depends_on:
      redis:
        condition: service_healthy
    # Aucune dépendance déclarée vers `presidio` : il est désactivé par défaut
    # (profil `ner-compose`, cf. plus haut), et un `depends_on` vers un service
    # non activé fait échouer `compose up`. Le NER est de toute façon
    # best-effort : le gateway ne doit JAMAIS être bloqué au démarrage par lui.
    #
    # Son absence n'est plus silencieuse pour autant :
    #   - un `ERROR` dans les journaux du gateway au démarrage (cf. main.rs) ;
    #   - `GET /health/ner`, qui répond 503 quand le NER est muet — c'est
    #     celui-là qu'il faut surveiller, pas `/health`.
    restart: unless-stopped

volumes:
  pseudo-redis-data:
