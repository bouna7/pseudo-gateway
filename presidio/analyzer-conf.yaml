# Conf ANALYZER (ANALYZER_CONF_FILE) — volontairement minimale.
#
# ⚠️ Historique : tout mettre dans CE fichier (nlp_configuration +
# recognizer_registry inline) marche sur le main de Presidio mais PAS sur la
# version embarquée dans l'image — le registre inline y était partiellement
# ignoré → « supported languages have to be consistent: registry ['en'] vs
# analyzer ['fr','en'] », worker gunicorn en crash-loop. D'où le schéma
# canonique à 3 fichiers, stable à travers les versions :
#   - analyzer-conf.yaml  (ce fichier)     → langues + seuil
#   - nlp-conf.yaml       (NLP_CONF_FILE)  → modèles spaCy + mapping NER
#   - recognizers.yaml    (RECOGNIZER_REGISTRY_CONF_FILE) → registre
#
# Les trois listes de langues DOIVENT être cohérentes (fr + en partout).
supported_languages:
  - fr
  - en

# Seuil géré par l'appelant : la passerelle envoie score_threshold=0.6 dans
# chaque requête /analyze (src/ner.rs) — on ne filtre pas une 2e fois ici.
default_score_threshold: 0
